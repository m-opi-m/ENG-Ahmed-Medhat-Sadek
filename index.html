<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed Medhat Sadek | Structural Design Engineer</title>
<meta name="description" content="Ahmed Medhat Sadeq — Structural Design Engineer | م. أحمد مدحت صادق — مهندس تصميم إنشائي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&family=Sora:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a18;--bg2:#0a1330;--ink:#eaf2ff;--mut:#8ea3c7;--cy:#38bdf8;--or:#ff7a1a;--line:rgba(56,189,248,.18);--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;overflow-x:hidden;line-height:1.7}
html[dir=ltr] body{font-family:'Sora','Cairo',sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:
linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,
linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;
mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);animation:grid 20s linear infinite}
@keyframes grid{to{background-position:0 48px,48px 0}}
#glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(circle,rgba(56,189,248,.14),transparent 65%);transform:translate(-50%,-50%);left:50%;top:30%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:auto;padding:0 24px}
nav{position:fixed;top:0;inset-inline:0;z-index:50;transition:.4s}
nav.s{background:rgba(5,10,24,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{font-weight:900;font-size:1.3rem;display:flex;gap:10px;align-items:center}
.logo i{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--cy),var(--or));display:grid;place-items:center;color:#050a18;font-style:normal;font-weight:900;font-size:.95rem;animation:pulse 3s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(56,189,248,0)}0%{box-shadow:0 0 0 0 rgba(56,189,248,.5)}}
.links{display:flex;gap:30px;color:var(--mut);font-weight:500}
.links a{position:relative;transition:.3s}.links a:hover{color:var(--ink)}
.links a:after{content:"";position:absolute;bottom:-4px;inset-inline-start:0;width:0;height:2px;background:var(--or);transition:.3s}.links a:hover:after{width:100%}
.lang{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 18px;border-radius:99px;cursor:pointer;font:inherit;font-weight:700;transition:.3s}
.lang:hover{border-color:var(--cy);background:rgba(56,189,248,.1)}
section{position:relative;padding:110px 0}
#hero{min-height:100vh;display:flex;align-items:center;padding-top:110px}
#hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center;width:100%}
.badge{display:inline-flex;gap:10px;align-items:center;padding:6px 18px;border:1px solid var(--line);border-radius:99px;color:var(--cy);font-weight:700;font-size:.9rem;background:rgba(56,189,248,.07)}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--or);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
h1{font-size:clamp(2.6rem,6vw,5.2rem);font-weight:900;line-height:1.1;margin:22px 0}
h1 span{display:inline-block;opacity:0;transform:translateY(60px) rotateX(-80deg);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;background:linear-gradient(120deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{to{opacity:1;transform:none}}
.sub{color:var(--mut);font-size:1.15rem;max-width:520px;margin-bottom:34px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{padding:14px 32px;border-radius:14px;font-weight:700;transition:.3s;display:inline-block;border:1px solid transparent;cursor:pointer;font-family:inherit;font-size:1rem}
.p{background:linear-gradient(135deg,var(--or),#ff9d4d);color:#1a0d00;box-shadow:0 12px 40px -10px rgba(255,122,26,.6)}
.p:hover{transform:translateY(-4px) scale(1.03)}
.g{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.03)}.g:hover{border-color:var(--cy);transform:translateY(-4px)}
#stage{height:min(74vh,620px);position:relative}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
.scroll{position:absolute;bottom:26px;left:50%;width:24px;height:40px;border:2px solid var(--mut);border-radius:14px;opacity:.6}
.scroll:after{content:"";position:absolute;top:6px;left:50%;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--cy);animation:sc 1.6s infinite}
@keyframes sc{to{transform:translateY(14px);opacity:0}}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:18px 0;background:rgba(10,19,48,.6);direction:ltr}
.mq div{display:flex;gap:56px;width:max-content;animation:mq 28s linear infinite;font-family:'Sora',sans-serif;font-weight:700;color:var(--mut);font-size:1.2rem;white-space:nowrap}
.mq b{color:var(--or)}
@keyframes mq{to{transform:translateX(-50%)}}
.h2{font-size:clamp(2rem,4vw,3.2rem);font-weight:900;margin-bottom:14px;line-height:1.2}
.lead{color:var(--mut);max-width:620px;font-size:1.1rem}
.head{margin-bottom:56px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;perspective:1200px}
.card{position:relative;padding:38px 30px;border-radius:var(--r);background:linear-gradient(160deg,rgba(18,30,63,.85),rgba(8,14,34,.9));border:1px solid var(--line);transform-style:preserve-3d;transition:transform .15s,border-color .3s;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0),rgba(56,189,248,.18),transparent 45%);opacity:0;transition:.3s}
.card:hover{border-color:rgba(56,189,248,.55)}.card:hover:before{opacity:1}
.ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;margin-bottom:22px;transform:translateZ(50px);background:rgba(56,189,248,.12);color:var(--cy)}
.ic svg{width:30px;height:30px}
.card h3{font-size:1.35rem;margin-bottom:10px;transform:translateZ(35px)}
.card p{color:var(--mut);transform:translateZ(20px)}
.abt{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chips span{padding:10px 20px;border:1px solid var(--line);border-radius:12px;background:rgba(56,189,248,.06);font-weight:700;transition:.3s;font-family:'Sora',sans-serif}
.chips span:hover{transform:translateY(-5px) rotate(-2deg);border-color:var(--or);color:var(--or)}
.cube{width:200px;height:200px;margin:auto;perspective:900px}
.cube div{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
.cube i{position:absolute;inset:0;border:1.5px solid var(--cy);background:rgba(56,189,248,.05);display:grid;place-items:center;font:800 1.6rem 'Sora';color:var(--cy);font-style:normal;box-shadow:inset 0 0 40px rgba(56,189,248,.15)}
.cube i:nth-child(1){transform:translateZ(100px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(100px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(100px);border-color:var(--or);color:var(--or)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(100px);border-color:var(--or);color:var(--or)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(100px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(100px)}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.form{max-width:760px;margin:auto;padding:48px;border-radius:24px;background:rgba(10,19,48,.7);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 40px 100px -40px rgba(56,189,248,.35)}
.form h2{text-align:center}.form>p{text-align:center;color:var(--mut);margin-bottom:30px}
label.l{display:block;font-weight:700;margin:20px 0 8px;font-size:.95rem}
input[type=text],select{width:100%;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:inherit;outline:none;transition:.3s}
input:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 4px rgba(56,189,248,.15)}
.rad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rad label{display:flex;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.3s}
.rad label:has(input:checked){border-color:var(--or);background:rgba(255,122,26,.08)}
.rad input{accent-color:var(--or)}
.phr{display:grid;grid-template-columns:104px 1fr;gap:10px}.phr input{min-width:0}.phr .dial{text-align:center;font-weight:700;letter-spacing:.5px}.phr .dial[readonly]{cursor:default}
.wa{width:100%;margin-top:30px;background:#16a34a;color:#fff;display:flex;gap:12px;justify-content:center;align-items:center;box-shadow:0 14px 40px -12px rgba(22,163,74,.7)}
.wa:hover{transform:translateY(-4px);background:#22c55e}.wa svg{width:24px;height:24px;fill:#fff}
#res{display:none;margin-top:26px;padding:28px;border-radius:18px;text-align:center;background:linear-gradient(160deg,rgba(22,163,74,.14),rgba(56,189,248,.08));border:1px solid rgba(74,222,128,.45);animation:pop .6s cubic-bezier(.2,.8,.2,1)}
#res.show{display:block}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.94)}}
#res h4{font-size:1.3rem;color:#4ade80;margin-bottom:6px}
#res p{color:var(--mut);font-size:.95rem}
#res .ct{color:var(--ink);font-weight:700;font-size:1.08rem;margin:2px 0 14px}
.cbox{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto;flex-wrap:wrap}
.cbox b{font:800 2rem 'Sora',sans-serif;letter-spacing:3px;padding:8px 24px;border-radius:12px;background:var(--bg);border:1px dashed var(--cy);color:var(--cy);direction:ltr}
.cpy{padding:12px 22px;border-radius:12px;border:0;cursor:pointer;font:700 1rem inherit;font-family:inherit;background:var(--cy);color:#04101f;transition:.3s}
.cpy:hover{transform:translateY(-3px)}.cpy.ok{background:#4ade80}
.certbtn{display:inline-flex;gap:12px;align-items:center;padding:14px 26px;margin-bottom:34px;border-radius:14px;border:1px solid rgba(255,122,26,.55);background:rgba(255,122,26,.08);color:var(--ink);font:700 1rem inherit;font-family:inherit;cursor:pointer;transition:.35s}
.certbtn svg{width:24px;height:24px;fill:none;stroke:var(--or);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.certbtn:hover{transform:translateY(-4px);background:rgba(255,122,26,.16);box-shadow:0 16px 40px -14px rgba(255,122,26,.6)}
#cm{position:fixed;inset:0;z-index:100;display:none;overflow:auto;padding:24px 20px;background:rgba(3,7,18,.88);backdrop-filter:blur(10px);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cm.open{display:flex}
.cw{position:relative;margin:auto;width:min(980px,96vw);perspective:1400px;animation:flip .7s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{opacity:0;transform:rotateX(-40deg) scale(.85)}}
.cw.pt{width:min(720px,94vw)}
.cw h3{text-align:center;margin-bottom:14px;font-size:1.2rem}
.cf{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 40px 100px -20px rgba(56,189,248,.35);border:1px solid var(--line)}
#cc{display:block;width:100%;height:auto;transition:filter .25s}
#cc.bl{filter:blur(28px)}
.cs{position:absolute;inset:0}
.cx{position:absolute;top:-6px;inset-inline-end:-6px;z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:1.4rem;cursor:pointer;transition:.3s}
.cx:hover{background:var(--or);color:#1a0d00;transform:rotate(90deg)}
.cn{text-align:center;color:var(--mut);font-size:.85rem;margin-top:12px}
@media print{#cm,body>*{display:none!important}}
.logo img.lg{height:42px;width:auto;filter:drop-shadow(0 0 1px rgba(255,255,255,.5)) drop-shadow(0 4px 14px rgba(255,122,26,.35));transition:transform .5s}
.logo:hover img.lg{transform:rotateY(180deg) scale(1.08)}
.flogo{display:block;width:min(240px,60vw);height:auto;margin:0 auto 30px;filter:drop-shadow(0 0 1px rgba(255,255,255,.45)) drop-shadow(0 10px 30px rgba(255,122,26,.3));animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
#sp{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;animation:spo .7s 1.7s forwards}
#sp img{width:min(380px,72vw);height:auto;filter:drop-shadow(0 0 1px rgba(255,255,255,.5)) drop-shadow(0 10px 50px rgba(255,122,26,.45));animation:spi 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes spi{from{opacity:0;transform:scale(.55) rotateY(-80deg)}}
@keyframes spo{to{opacity:0;visibility:hidden}}
.fbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.fbtns .certbtn{margin:0}
footer{padding:70px 0 40px;border-top:1px solid var(--line);text-align:center;background:linear-gradient(transparent,rgba(10,19,48,.8))}
footer h3{font-size:1.5rem;margin-bottom:26px}
.soc{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:38px;perspective:600px}
.soc a{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:rgba(56,189,248,.07);border:1px solid var(--line);transition:.35s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.soc svg{width:26px;height:26px;fill:var(--ink);transition:.3s}
.soc a:hover{transform:translateY(-10px) rotateX(18deg) rotateY(-12deg);background:var(--c);border-color:var(--c);box-shadow:0 20px 40px -10px var(--c)}
.soc a:hover svg{fill:#fff;stroke:#fff}
.soc svg.ig{fill:none;stroke:var(--ink);stroke-width:2}.soc svg.ig circle:last-child{fill:var(--ink);stroke:none}
.soc a:hover svg.ig{fill:none;stroke:#fff}.soc a:hover svg.ig circle:last-child{fill:#fff}
footer small{color:var(--mut)}
.rv{opacity:0;transform:translateY(50px) scale(.97);transition:1s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
@media(max-width:900px){#hero .wrap,.abt,.grid{grid-template-columns:1fr}.links{display:none}#stage{height:360px;order:-1}.form{padding:28px}.rad{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){#sp{display:none}*{animation:none!important;transition:none!important}h1 span,.rv{opacity:1;transform:none}}

/* ===== Concrete & Steel theme (overrides) ===== */
:root{--bg:#e8e5de;--bg2:#d9d5cb;--ink:#16191e;--mut:#5a5f67;--cy:#b07a00;--or:#e8590c;--line:rgba(20,24,31,.16);--st:#14181f;--yl:#ffc400}
body{background-color:var(--bg)}body:before,#glow{display:none}
nav{color:#fff;--ink:#fff;--mut:#c9ced6;--line:rgba(255,255,255,.22)}
nav.s{background:rgba(14,17,22,.93);border-bottom:3px solid var(--yl)}
#hero{--ink:#fff;--mut:#dfe3e9;--line:rgba(255,255,255,.28);--cy:#ffc400;position:relative;overflow:hidden;background:linear-gradient(#26364f,#e6a86a 70%,#7a6a58);color:#fff}
#hero .wrap{grid-template-columns:minmax(0,660px)}
#hero .wrap>div:first-child{position:relative;z-index:2}
#hero:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(8,10,14,.86),rgba(8,10,14,.5) 48%,transparent 78%)}
html[dir=rtl] #hero:after{transform:scaleX(-1)}
#stage{position:absolute;inset:0;height:auto!important;order:0}
.scroll{z-index:2;border-color:#fff}
h1 span{background:none;-webkit-text-fill-color:#fff;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.badge{background:rgba(0,0,0,.35);color:var(--yl);border-color:rgba(255,196,0,.5)}
#hero .btn.g{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(0,0,0,.25)}
.p{background:var(--yl);color:#15100a;box-shadow:0 12px 34px -10px rgba(255,196,0,.7)}
.mq{--mut:#c9ced6;background:var(--st);border-color:#000;border-top:8px solid;border-image:repeating-linear-gradient(45deg,var(--yl) 0 14px,var(--st) 14px 28px) 8}
.mq b{color:var(--yl)}
.h2:after{content:"";display:block;width:84px;height:7px;margin-top:14px;background:repeating-linear-gradient(45deg,var(--yl) 0 9px,var(--st) 9px 18px)}
.form .h2:after{margin-inline:auto}
#tools{background:rgba(255,255,255,.4)}
.chips span{background:#fff;color:var(--ink);border-radius:6px;border-color:var(--line)}
.chips span:hover{border-color:var(--or);color:var(--or)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stats div{background:var(--st);color:#fff;padding:26px 24px;border-radius:6px;border-inline-start:6px solid var(--yl);box-shadow:0 24px 40px -26px rgba(0,0,0,.6);transition:.4s}
.stats div:hover{transform:translateY(-6px)}
.stats b{display:block;font:800 3.1rem/1.1 'Sora',sans-serif;color:var(--yl)}
.stats span{color:#c9ced6;font-size:.98rem}
.card{background:#f8f6f1;border:1px solid var(--line);border-radius:8px;box-shadow:0 28px 46px -30px rgba(0,0,0,.55)}
.card:before{background:radial-gradient(400px circle at var(--mx,50%) var(--my,0),rgba(255,196,0,.22),transparent 45%)}
.card:hover{border-color:var(--yl)}
.ic{background:var(--st)!important;color:var(--yl)!important;border-radius:8px}
.form{background:#f8f6f1;border-radius:10px;box-shadow:0 40px 70px -40px rgba(0,0,0,.55)}
input[type=text],select{background:#fff}
input:focus,select:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(232,89,12,.15)}
footer{--ink:#f2f4f7;--mut:#a4adba;--line:rgba(255,255,255,.18);--cy:#ffc400;background:var(--st);color:#fff;border-top:8px solid;border-image:repeating-linear-gradient(45deg,var(--yl) 0 14px,var(--st) 14px 28px) 8}
.soc a{background:rgba(255,255,255,.06)}
#cm{--ink:#eef1f5;--mut:#aeb6c2;--bg2:#1b2029}
#sp{background:#0e1116}
</style>
</head>
<body>
<div id="glow"></div>
<div id="sp" aria-hidden="true"><img data-logo="full" alt=""></div>
<nav id="nav"><div class="wrap">
<a href="#hero" class="logo"><img class="lg" data-logo="mark" alt="Eng. Ahmed Medhat logo"><span data-i="logo"></span></a>
<div class="links"><a href="#about" data-i="nAbout"></a><a href="#tools" data-i="nTools"></a><a href="#contact" data-i="nContact"></a></div>
<button class="lang" id="lt" aria-label="Language"></button>
</div></nav>

<section id="hero"><div class="wrap">
<div>
<span class="badge" data-i="badge"></span>
<h1 id="h1"></h1>
<p class="sub" data-i="sub"></p>
<div class="btns"><a href="#contact" class="btn p" data-i="b1"></a><a href="#tools" class="btn g" data-i="b2"></a></div>
</div>
<div id="stage"></div>
</div><div class="scroll"></div></section>

<div class="mq"><div id="mq"></div></div>

<section id="about"><div class="wrap abt">
<div class="rv"><h2 class="h2" data-i="aTitle"></h2><p class="lead" style="margin-bottom:28px" data-i="aText"></p>
<div class="chips"><span>ETABS</span><span>SAFE</span><span>SAP2000</span><span>AutoCAD</span><span>Revit</span><span>SBC</span><span>ACI</span></div></div>
<div class="rv stats"><div><b data-n="9">0+</b><span data-i="s1"></span></div><div><b data-n="7">0+</b><span data-i="s2"></span></div><div><b data-n="350">0+</b><span data-i="s3"></span></div><div><b data-n="15">0+</b><span data-i="s4"></span></div></div></div>
</div></section>

<section id="tools"><div class="wrap">
<div class="head rv"><h2 class="h2" data-i="tTitle"></h2><p class="lead" data-i="tSub"></p></div>
<div class="grid">

function sendRequest(d){
 return new Promise((resolve,reject)=>{
  const cb='__as_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
  const s=document.createElement('script');
  let done=false,tm=null;
  const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(tm);window[cb]=()=>{};s.remove();fn(v)};
  window[cb]=r=>{r&&r.ok&&r.code?finish(resolve,r.code):finish(reject,new Error((r&&r.error)||'server'))};
  s.onerror=()=>finish(reject,new Error('network'));
  tm=setTimeout(()=>finish(reject,new Error('timeout')),15000);
  s.async=true;
  s.src=WEB_APP_URL+'?'+new URLSearchParams({action:'submit',callback:cb,name:d.name,type:d.type,loc:d.loc,phone:d.phone,lang:d.lang,hp:d.hp||''}).toString();
  document.head.appendChild(s);
 });
}

 const m=$('#cm'),cv=$('#cc'),ctx=cv.getContext('2d'),cwn=m.querySelector('.cw');let img=null,open=false,mode='c';
 function wm(w,h,col,f){ctx.save();ctx.rotate(-.45);ctx.fillStyle=col;ctx.font='700 '+f+'px Arial';
  const T2='AHMED MEDHAT SADEK - VIEW ONLY',sx=ctx.measureText(T2).width+140,sy=f*3.7;let r=0;

 function drawLetter(){
  const W=1240,P=110,mw=W-2*P,F='"Segoe UI",Arial,sans-serif';
  const paras=["I am writing to express my strong interest in joining your esteemed organization as a Structural Design Engineer. With 9 years of professional experience in civil and structural engineering, including 7 years working extensively in the Kingdom of Saudi Arabia, I have developed a proven track record in the design, analysis, and supervision of both concrete and steel structures.",
  "In my current role at Emaar and Salama Engineering Consulting Company, I have successfully delivered between 350 and 400 residential, commercial, and administrative projects. I am highly proficient in utilizing industry-leading structural analysis and BIM software, including ETABS, SAFE, SAP2000, AutoCAD, and Revit. This technical expertise enables me to optimize structural systems effectively, thereby improving material efficiency, reducing overall construction costs, and ensuring strict compliance with the Saudi Building Code (SBC) and international engineering standards.",
  "Beyond my design capabilities, I possess strong project coordination and site supervision skills. I have successfully managed over 15 concurrent maintenance projects, streamlining workflows to improve operational efficiency. Furthermore, I am a licensed Professional Engineer registered with the Saudi Council of Engineers and a recognized member of the Egyptian Engineers Syndicate.",

  function lay(draw){let y=P;

   tx('AHMED MEDHAT SADEK','800 48px '+F,'#0a1128',58,2);

   tx('September 18, 2026','400 25px '+F,'#4a5568',36,26);
   tx('Dear Hiring Manager,','700 26px '+F,'#0a1128',38,20);
   paras.forEach(p=>tx(p,'400 25px '+F,'#1f2937',39,22));
   tx('Sincerely,','400 25px '+F,'#1f2937',38,6);
   tx('Ahmed Medhat Sadek','800 28px '+F,'#0a1128',40,0);
   return y}
  cv.width=W;cv.height=4000;const end=lay(false);
